name: sentinel_vision_mobile
description: Local-first mobile video intelligence MVP for Sentinel Vision.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  file_picker: ^11.0.2
  flutter_litert: ^2.5.2
  google_mlkit_commons: ^0.11.1
  google_mlkit_image_labeling: ^0.14.2
  image: ^4.8.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2+1
  sqflite_common: ^2.5.7
  sqflite_common_ffi: ^2.4.0+3
  video_player: ^2.11.1
  video_thumbnail: ^0.5.6
  google_mlkit_face_detection: ^0.13.2
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/efficientdet_lite0.tflite
    - assets/models/labelmap.txt
    - assets/images/SVM-logo.png
